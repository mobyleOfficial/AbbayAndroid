    }

    signingConfigs {
        release {
            storeFile file("C:\\Users\\Abe\\Documents\\Keystore\\keystore.jks")
            storePassword localProperties["KEYSTORE_PASSWORD"]
            keyAlias localProperties["KEY_ALIAS"]
            keyPassword localProperties["KEY_PASSWORD"]
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release.storeFile.exists() ? signingConfigs.release : signingConfigs.debug
