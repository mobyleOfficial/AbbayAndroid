licenseReport {
    configurations = ['releaseRuntimeClasspath']
    excludeOwnGroup = true
    excludeBoms = true
    allowedLicensesFile = rootProject.file('config/licenses/allowed-licenses.json')
    filters = [new com.github.jk1.license.filter.LicenseBundleNormalizer(
        bundlePath: rootProject.file('config/licenses/license-normalizer-bundle.json').path,
        createDefaultTransformationRules: true
    )]
}

abstract class LicenseNoticesTask extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getLicenseReport()

    @InputFile
    abstract RegularFileProperty getCredits()

    @Input
    abstract SetProperty<String> getModules()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void write() {
        def report = new groovy.json.JsonSlurper().parse(licenseReport.get().asFile)
        def wanted = modules.get()
        def libraries = report.dependencies.findAll { wanted.contains(it.moduleName) }.collect { dependency ->
            def license = dependency.moduleLicenses ? dependency.moduleLicenses[0] : [:]
            [name: dependency.moduleName, version: dependency.moduleVersion ?: '', license: license.moduleLicense ?: '',
             url: license.moduleLicenseUrl ?: '']
        }.sort { it.name }
        def notices = [
            bundled: creditsTable('Bundled source code'),
            assets: creditsTable('Assets'),
            libraries: libraries,
        ]
        def output = outputDirectory.get().file('licenses.json').asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.toJson(notices)
    }

    private List<Map<String, String>> creditsTable(String heading) {
        def lines = credits.get().asFile.readLines()
        def start = lines.findIndexOf { it.trim() == "## ${heading}" }
        if (start < 0) return []
        def rows = lines.drop(start + 1).dropWhile { !it.startsWith('|') }.takeWhile { it.startsWith('|') }.drop(2)
        rows.collect { row ->
            def cells = row.split('\\|').collect { it.trim() }.findAll { true }.drop(1)
            [name: cells[0].replace('`', ''), source: cells[1].replace('`', ''), license: cells[2].replace('`', '')]
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def runtimeClasspath = configurations.named("${variant.name}RuntimeClasspath")
        def notices = tasks.register("generate${variant.name.capitalize()}LicenseNotices", LicenseNoticesTask) {
            dependsOn 'checkLicensePreparation', 'generateLicenseReport'
            licenseReport.set(layout.buildDirectory.file('reports/dependency-license/project-licenses-for-check-license-task.json'))
            credits.set(rootProject.layout.projectDirectory.file('CREDITS.md'))
            modules.set(provider {
                runtimeClasspath.get().incoming.resolutionResult.allComponents
                    .collect { it.moduleVersion }
                    .findAll { it != null && it.group }
                    .collect { "${it.group}:${it.name}".toString() } as Set
            })
            outputDirectory.set(layout.buildDirectory.dir("generated/licenseNotices/${variant.name}"))
        }
        variant.sources.assets?.addGeneratedSourceDirectory(notices) { it.outputDirectory }
    }
}

tasks.withType(Test).configureEach {
    if (name.endsWith('ReleaseUnitTest')) {
        exclude '**/abbay/ui/**'
    }
}
